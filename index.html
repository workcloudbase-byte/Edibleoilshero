<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edible Mart — Natural Oils</title><meta name="description" content="Edible Mart — Natural Oils"><style>html,body{margin:0;min-height:100%;background:#06110c;color:#fff;font-family:system-ui,sans-serif}#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#status div{max-width:620px}#status h1{font-size:32px}#status p{color:#a9b8b0;line-height:1.6}.spin{display:inline-block;width:26px;height:26px;border:3px solid #35523f;border-top-color:#f4c84e;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="status"><div><span class="spin"></span><h1>Loading Edible Mart…</h1><p>Preparing the website and its supplied image assets.</p></div></div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>(async()=>{const status=document.getElementById('status');try{const base=new URL('.',location.href);const zipUrl=new URL('edible_mart_3d_website.zip',base);const res=await fetch(zipUrl);if(!res.ok)throw new Error('Website package could not be loaded ('+res.status+').');const zip=await JSZip.loadAsync(await res.arrayBuffer());const assetNames=Object.keys(zip.files).filter(n=>n.startsWith('assets/')&&!zip.files[n].dir);const urls={};for(const name of assetNames){const blob=await zip.files[name].async('blob');urls[name]=''+URL.createObjectURL(blob)}const html=await zip.files['index.html'].async('string');const rewritten=html.replace(/(?:\.\/)?assets\/([A-Za-z0-9._-]+)/g,(m,file)=>urls['assets/'+file]||m);document.open();document.write(rewritten);document.close()}catch(err){status.innerHTML='<div><h1>Edible Mart</h1><p>'+String(err.message||err)+'</p><p>Make sure GitHub Pages is serving both <code>index.html</code> and <code>edible_mart_3d_website.zip</code> from the same directory.</p></div>'}})();</script></body></html>
